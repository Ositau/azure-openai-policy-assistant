# Infrastructure pipeline: Validate -> Plan -> (manual approval) -> Apply.
#
# The Plan stage saves the plan file as a pipeline artifact (private project).
# After approval, the Apply stage applies exactly that saved plan, so what runs
# is what was reviewed. If the state changed in between, Terraform rejects the
# stale plan and the run fails safely.

trigger:
  branches:
    include: [main]
  paths:
    include: [infra/*, pipelines/infra.yml, pipelines/templates/*]
    exclude: [infra/bootstrap/*]

pr: none

variables:
  - group: policy-assistant
  - name: tfVersion
    value: 1.14.7
  - name: tflintVersion
    value: 0.58.1

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Validate
    jobs:
      - job: validate
        displayName: Format, validate, lint
        steps:
          - template: templates/install-tools.yml
            parameters:
              tflint: true
          - script: |
              set -euo pipefail
              terraform fmt -check -recursive infra
              for dir in infra infra/bootstrap; do
                terraform -chdir=$dir init -backend=false -input=false
                terraform -chdir=$dir validate
                tflint --chdir=$dir --init
                tflint --chdir=$dir
              done
            displayName: terraform fmt / validate / tflint

  - stage: Plan
    dependsOn: Validate
    jobs:
      - job: plan
        displayName: Terraform plan
        steps:
          - template: templates/install-tools.yml

          # The Container App needs an image on first creation. Build one if the
          # registry is still empty; afterwards the app pipeline owns releases.
          - task: AzureCLI@2
            displayName: Ensure an initial image exists
            inputs:
              azureSubscription: $(serviceConnectionName)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                if az acr repository show --name "$(acrName)" --image policy-assistant:latest >/dev/null 2>&1; then
                  echo "policy-assistant:latest already present"
                else
                  az acr build --registry "$(acrName)" --image "policy-assistant:latest" --image "policy-assistant:$(Build.BuildId)" app
                fi

          - template: templates/terraform.yml
            parameters:
              displayName: terraform plan
              script: |
                set +e
                terraform -chdir=infra plan -input=false -detailed-exitcode -out=tfplan
                code=$?
                set -e
                if [ $code -eq 1 ]; then exit 1; fi
                echo "##vso[task.setvariable variable=hasChanges]$([ $code -eq 2 ] && echo true || echo false)"
                mkdir -p "$(Build.ArtifactStagingDirectory)/plan"
                cp infra/tfplan infra/.terraform.lock.hcl "$(Build.ArtifactStagingDirectory)/plan/"
                echo "Changes to approve:"
                terraform -chdir=infra show -json tfplan \
                  | jq -r '.resource_changes[] | select(.change.actions != ["no-op"]) | "\(.change.actions | join("/"))  \(.address)"'

          - script: echo "##vso[task.setvariable variable=hasChanges;isOutput=true]$(hasChanges)"
            name: result
            displayName: Publish plan result

          - publish: $(Build.ArtifactStagingDirectory)/plan
            artifact: tfplan
            displayName: Publish plan file

  - stage: Apply
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(dependencies.Plan.outputs['plan.result.hasChanges'], 'true'))
    jobs:
      - deployment: apply
        displayName: Terraform apply
        environment: policy-assistant-demo # approval check configured on this environment
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: current
                  artifact: tfplan
                - template: templates/install-tools.yml
                - template: templates/terraform.yml
                  parameters:
                    displayName: Apply the approved plan
                    script: |
                      cp "$(Pipeline.Workspace)/tfplan/tfplan" infra/tfplan
                      terraform -chdir=infra apply -input=false tfplan
                      echo "App URL: $(terraform -chdir=infra output -raw app_url)"
                      echo "Sign-in redirect domain: $(terraform -chdir=infra output -raw easy_auth_redirect_domain)"
