<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Policy Assistant</title>
<style>
  :root { --navy:#13294b; --blue:#2563eb; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --bg:#f6f7f9; --card:#fff; --green:#15803d; --amber:#b45309; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--navy); color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:18px; font-weight:600; }
  header small { display:block; opacity:.75; font-weight:400; font-size:12px; }
  .who { font-size:13px; text-align:right; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; margin-left:4px; background:#fff2; }
  .badge.hr { background:#f59e0b; color:#111; }
  main { max-width:820px; margin:0 auto; padding:20px 16px 140px; }
  .intro { color:var(--muted); font-size:14px; margin-bottom:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .chip { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .chip:hover { border-color:var(--blue); color:var(--blue); }
  .msg { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
  .msg.q { background:#eef2ff; border-color:#c7d2fe; font-weight:500; }
  .msg.na { border-left:4px solid var(--amber); }
  .msg.ok { border-left:4px solid var(--green); }
  .cites { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
  .cite { font-size:12px; background:#f1f5f9; border:1px solid var(--line); border-radius:6px; padding:3px 8px; color:#334155; }
  .meta { font-size:11px; color:var(--muted); margin-top:8px; }
  form { position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:1px solid var(--line); padding:14px 16px; }
  .bar { max-width:820px; margin:0 auto; display:flex; gap:8px; }
  input { flex:1; padding:12px 14px; border:1px solid var(--line); border-radius:8px; font-size:15px; }
  button { background:var(--blue); color:#fff; border:0; border-radius:8px; padding:0 18px; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; }
  .foot { max-width:820px; margin:8px auto 0; font-size:11px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Policy Assistant <small>Kestrel Bridge Finance (fictional demo)</small></h1>
  <div class="who" id="who">Signing in…</div>
</header>
<main>
  <p class="intro">Ask about company policies. Answers come only from the policies your groups can access, with the source for every answer.</p>
  <div class="chips" id="chips"></div>
  <div id="log"></div>
</main>
<form id="f">
  <div class="bar">
    <input id="q" maxlength="500" placeholder="e.g. Can I accept a £60 gift from a supplier?" autocomplete="off" required>
    <button id="b">Ask</button>
  </div>
  <div class="foot">Answers are generated by Azure OpenAI from internal policies. Questions are logged for audit.</div>
</form>
<script>
const examples = [
  "Can I accept a £60 gift from a supplier?",
  "What is the hotel limit in London?",
  "How quickly must we answer a subject access request?",
  "Can I work from Spain for two weeks?",
  "What is the salary range for Grade 4?",
];
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

fetch("/api/me").then(r => r.json()).then(me => {
  const badges = me.groups.map(g => `<span class="badge ${g === "HR" ? "hr" : ""}">${esc(g)}</span>`).join("");
  $("who").innerHTML = `${esc(me.name)}<br>${badges || '<span class="badge">no groups</span>'}`;
});

for (const e of examples) {
  const c = document.createElement("button");
  c.type = "button"; c.className = "chip"; c.textContent = e;
  c.onclick = () => { $("q").value = e; $("f").requestSubmit(); };
  $("chips").append(c);
}

function add(html, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls; d.innerHTML = html;
  $("log").append(d); d.scrollIntoView({behavior: "smooth", block: "end"});
  return d;
}

$("f").onsubmit = async ev => {
  ev.preventDefault();
  const question = $("q").value.trim();
  if (!question) return;
  $("q").value = ""; $("b").disabled = true;
  add(esc(question), "q");
  const pending = add("Searching policies…", "");
  try {
    const r = await fetch("/api/ask", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({question})});
    if (!r.ok) throw new Error(r.status);
    const a = await r.json();
    const cites = a.citations.map(c => `<span class="cite">${esc(c.title)} › ${esc(c.section)}</span>`).join("");
    pending.className = "msg " + (a.answerable ? "ok" : "na");
    pending.innerHTML = `${esc(a.answer)}${cites ? `<div class="cites">${cites}</div>` : ""}<div class="meta">${a.latency_ms} ms</div>`;
  } catch (e) {
    pending.className = "msg na"; pending.textContent = "Something went wrong. Please try again.";
  } finally { $("b").disabled = false; $("q").focus(); }
};
</script>
</body>
</html>
